<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1326" />
  <meta name="description" content="AspireNest Learning Drive final standalone master with complete Public, Student, Mentor and Admin operating systems, role-safe Notification Center, learning engines, Access Engine and responsive workflows" />
  <title>AspireNest Academy — Learning Drive</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="app" class="app-shell" data-view="grid" data-workspace-role="public">
    <header class="topbar">
      <button class="brand" id="brandHome" aria-label="Open AspireNest Home">
        <span class="brand-copy"><strong>AspireNest</strong><small>Academy</small></span>
      </button>

      <div class="global-search" role="search">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg>
        <input id="globalSearch" type="search" autocomplete="off" placeholder="Search notes, videos, tests and roadmaps" aria-label="Search AspireNest learning resources" />
        <kbd>/</kbd>
        <button id="searchFiltersButton" class="icon-button" aria-label="Open search filters" aria-expanded="false">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        </button>
      </div>

      <div class="top-actions">
        <button id="quickContinue" class="continue-pill" title="Start or continue learning">
          <span class="pulse-dot" aria-hidden="true"></span>
          Start Learning
        </button>
        <button class="icon-button" id="notificationsButton" aria-label="Notifications">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 8h18c0-1-3-1-3-8M10 20h4"/></svg>
          <span class="notification-dot" aria-hidden="true"></span>
        </button>
        <button class="role-pill" id="roleButton" aria-label="Current workspace">Public</button>
        <button class="avatar" id="accountButton" aria-label="Open account menu" aria-expanded="false">RR</button>
      </div>
    </header>

    <aside class="parent-rail" aria-label="Primary navigation">
      <nav id="parentNav"></nav>
      <div class="rail-footer">
        <button class="rail-link compact" data-action="switch-workspace" title="Switch workspace">
          <span class="nav-icon">⇄</span><span class="nav-label">Preview</span>
        </button>
      </div>
    </aside>

    <aside class="context-rail" aria-label="Context navigation">
      <div class="context-header">
        <div>
          <span class="eyebrow" id="contextEyebrow">AspireNest</span>
          <h2 id="contextTitle">Home</h2>
        </div>
        <button class="icon-button" id="collapseContext" aria-label="Collapse contextual navigation" aria-expanded="true">‹</button>
      </div>
      <nav id="contextNav"></nav>
      <div class="plan-summary" id="planSummary"></div>
    </aside>

    <main id="main-content" tabindex="-1">
      <div class="mobile-context-strip" id="mobileContextStrip" aria-label="Section shortcuts"></div>
      <div id="pageContent"></div>
    </main>

    <nav class="mobile-dock" id="mobileDock" aria-label="Mobile primary navigation"></nav>
  </div>

  <div id="overlay" class="overlay" hidden></div>
  <aside id="detailDrawer" class="detail-drawer" aria-hidden="true" aria-label="Resource workspace"></aside>
  <section id="sheet" class="bottom-sheet" aria-hidden="true" aria-label="Guidance"></section>
  <div id="modalRoot"></div>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="vendor/jszip.min.js"></script>

  <script src="integration/aspirenest-adapter.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
